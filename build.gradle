buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "gtnh"
            url = "https://nexus.gtnewhorizons.com/repository/public/"
        }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.0.12'
    }
}

apply plugin: 'forge'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

group   = 'com.passivemobs'
version = '1.4.0'
archivesBaseName = "passivemobs"

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir  = 'run'
}

repositories {
    maven {
        name = "gtnh"
        url  = "https://nexus.gtnewhorizons.com/repository/public/"
    }
}

dependencies {}

// Bytecode checks do not require a running Minecraft client/server or a test framework.
task transformerRegression(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.compileClasspath + sourceSets.test.output + sourceSets.main.output
    mainClass = 'com.passivemobs.asm.TransformerRegressionTest'
    args new File(gradle.gradleUserHomeDir,
            'caches/minecraft/net/minecraft/minecraft_merged/1.7.10/minecraft_merged-1.7.10.jar').absolutePath
}
check.dependsOn transformerRegression
// The regression runner only needs Java classes, not Minecraft's native input libraries.
test.classpath = sourceSets.test.compileClasspath + sourceSets.test.output + sourceSets.main.output

// Java 25+ compatibility for running Gradle tasks
tasks.withType(JavaExec) {
    if (JavaVersion.current().isJava9Compatible()) jvmArgs += [
        '-XX:+IgnoreUnrecognizedVMOptions',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.net=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED'
    ]
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin':                 'com.passivemobs.asm.PassiveMobsCorePlugin',
            'FMLCorePluginContainsFMLMod':    'true'
        )
    }
}
